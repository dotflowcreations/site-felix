<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" fill="none" width="100%" height="100%">
  <defs>
    <linearGradient id="felixGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7" />
      <stop offset="50%" stop-color="#06b6d4" />
      <stop offset="100%" stop-color="#0891b2" />
    </linearGradient>
    <filter id="subtleGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="glow" />
      <feComposite in="SourceGraphic" in2="glow" operator="over" />
    </filter>
  </defs>
  
  <!-- Outer circular frame with sleek biotech accents -->
  <circle cx="100" cy="100" r="90" stroke="url(#felixGrad)" stroke-width="7" fill="none" stroke-linecap="round" />
  
  <!-- Stylized DNA Double Helix structure matching Felix emblem -->
  <!-- Top lobe left & right strands -->
  <path d="M 68 55 C 68 35, 100 28, 100 28 C 100 28, 132 35, 132 55 C 132 75, 100 95, 100 100" 
        stroke="url(#felixGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 132 55 C 132 35, 100 28, 100 28 C 100 28, 68 35, 68 55 C 68 75, 100 95, 100 100" 
        stroke="url(#felixGrad)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35" />
  
  <!-- Bottom lobe left & right strands -->
  <path d="M 100 100 C 100 105, 68 125, 68 145 C 68 165, 100 172, 100 172 C 100 172, 132 165, 132 145 C 132 125, 100 105, 100 100" 
        stroke="url(#felixGrad)" stroke-width="7" stroke-linecap="round" fill="none" />
  <path d="M 100 100 C 100 105, 132 125, 132 145 C 132 165, 100 172, 100 172 C 100 172, 68 165, 68 145 C 68 125, 100 105, 100 100" 
        stroke="url(#felixGrad)" stroke-width="7" stroke-linecap="round" fill="none" opacity="0.35" />

  <!-- Horizontal ladder rungs (Base pairs) in top loop -->
  <line x1="78" y1="42" x2="122" y2="42" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="73" y1="55" x2="127" y2="55" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="77" y1="68" x2="123" y2="68" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="86" y1="80" x2="114" y2="80" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />

  <!-- Horizontal ladder rungs (Base pairs) in bottom loop -->
  <line x1="86" y1="120" x2="114" y2="120" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="77" y1="132" x2="123" y2="132" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="73" y1="145" x2="127" y2="145" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
  <line x1="78" y1="158" x2="122" y2="158" stroke="url(#felixGrad)" stroke-width="5" stroke-linecap="round" />
</svg>
